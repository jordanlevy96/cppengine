input:
  keyMappings:
    forward: [W, ArrowUp]
    left: [A, ArrowLeft]
    back: [S, ArrowDown]
    right: [D, ArrowRight]
    turn: [Space]
    quit: [ESC]
    zoomIn: [ScrollUp]
    zoomOut: [ScrollDown]
  scriptPath: input.lua

game:
  resourcePath: ../res/
  logPath: ../logs/editor.log
  appName: ImhotepEditor
  scenePath: ""  # Editor loads scene manually, don't auto-load
  debug: true
  htmlPath: ui/editor.html
  cssPath: ui/styles/editor.css
  luaStatePath: ui/state/editor.lua
  templateName: EditorUI

window:
  targetFPS: 60
  windowWidth: 1600
  windowHeight: 900
