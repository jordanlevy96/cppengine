name: "EditorTestScene"

scene:
  objects:
    - name: "Light"
      transform:
        pos: { x: 5, y: 10, z: 5 }
        scale: { x: 1.0, y: 1.0, z: 1.0 }
        color: { r: 1.0, g: 1.0, b: 0.8 }
      components:
        - type: "RenderComponent"
          shader: "Basic.shader"
          model: "cube.obj"

    - name: "Cube1"
      transform:
        pos: { x: 0, y: 0, z: 0 }
        scale: { x: 2.0, y: 2.0, z: 2.0 }
        color: { r: 0.8, g: 0.2, b: 0.2 }
      components:
        - type: "Lighting"
          shader: "Lighting.shader"
          model: "cube.obj"
          light: "Light"

    - name: "Cube2"
      transform:
        pos: { x: 5, y: 0, z: 0 }
        scale: { x: 1.5, y: 1.5, z: 1.5 }
        color: { r: 0.2, g: 0.8, b: 0.2 }
      components:
        - type: "Lighting"
          shader: "Lighting.shader"
          model: "cube.obj"
          light: "Light"

    - name: "Cube3"
      transform:
        pos: { x: -5, y: 0, z: 0 }
        scale: { x: 1.0, y: 1.0, z: 1.0 }
        color: { r: 0.2, g: 0.2, b: 0.8 }
      components:
        - type: "Lighting"
          shader: "Lighting.shader"
          model: "cube.obj"
          light: "Light"
