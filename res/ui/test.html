<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            color: #eee;
            font-family: Arial, sans-serif;
        }

        .ui-window {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            background-color: rgba(26, 26, 46, 0.9);
            border: 2px solid #00d4ff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        h1 {
            color: #00d4ff;
            font-size: 20px;
            margin: 0 0 15px 0;
        }

        h2 {
            font-size: 16px;
            margin: 0 0 10px 0;
        }

        .info {
            background-color: #16213e;
            padding: 10px;
            border-left: 3px solid #00d4ff;
            margin: 10px 0;
            font-size: 12px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 14px;
        }

        .stat-value {
            color: #00d4ff;
            font-weight: bold;
        }

        .button {
            background-color: #0f3460;
            color: #eee;
            border: 1px solid #00d4ff;
            padding: 8px 15px;
            margin: 5px 0;
            cursor: pointer;
            display: block;
            text-align: center;
            border-radius: 4px;
        }

        .button:hover {
            background-color: #1a5490;
        }
    </style>
</head>
<body>
    <div class="ui-window">
        <h1>Game HUD</h1>

        <div class="stats">
            <span>Score:</span>
            <span class="stat-value">0</span>
        </div>

        <div class="stats">
            <span>Level:</span>
            <span class="stat-value">1</span>
        </div>

        <div class="stats">
            <span>Lines:</span>
            <span class="stat-value">0</span>
        </div>

        <div class="info">
            HTML/CSS UI rendered with litehtml + V8 (planned)
        </div>

        <h2>Controls</h2>
        <div class="button">Pause</div>
        <div class="button">Restart</div>
        <div class="button">Menu</div>
    </div>
</body>
</html>
