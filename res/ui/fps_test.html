<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            color: #00ff00;
            font-family: monospace;
            font-size: 16px;
        }
        .fps-display {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ff00;
            min-width: 200px;
        }
        .fps-value {
            font-size: 24px;
            font-weight: bold;
            color: #00ff00;
        }
        .label {
            color: #888888;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="fps-display">
        <div class="label">FPS:</div>
        <div class="fps-value" id="fps">000</div>
        <div class="label">Frame Time:</div>
        <div class="fps-value" id="frametime">0.0ms</div>
    </div>
</body>
</html>
