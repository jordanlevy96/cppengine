name: "TetrisScene"

# Engine capabilities required by scene modules
capabilities:
  ui: true
  input: true

# Game-specific scripts loaded before entities (in order)
scripts:
  - "games/tetris/scripts/TetrisConstants.lua"
  - "games/tetris/scripts/TetriminoData.lua"
  - "games/tetris/scripts/Tetrimino.lua"
  - "games/tetris/scripts/TetrisGame.lua"
  - "games/tetris/scripts/TetrisInput.lua"

scene:
  objects:
    - name: "light"
      transform:
        pos: { x: 0, y: 38, z: 20 }
        scale: { x: 0.5, y: 0.5, z: 0.5 }
      components:
        - type: "RenderComponent"
          shader: "Basic.shader"
          model: "cube.obj"

    - name: "TetrisGrid"
      components:
        - type: "LuaScript"
          script: "games/tetris/scripts/TetrisGrid.lua"
          shader: "OutlinedCube.shader"
          model: "cube.obj"

    - name: "SkyBackground"
      components:
        - type: "LuaScript"
          script: "scripts/backgrounds/SkyBackground.lua"

    - name: "TiledBackground"
      components:
        - type: "LuaScript"
          script: "scripts/backgrounds/TiledBackground.lua"

    - name: "FlyingProps"
      components:
        - type: "LuaScript"
          script: "scripts/backgrounds/FlyingProps.lua"
          shader: "Basic.shader"
          models: "pyramid.obj,octahedron.obj,tetrahedron.obj,cube.obj"
          spawnRate: 0.75
          maxProps: 24
          speed: 12.0
          travelSign: 1.0
          spawnDistanceMin: 80.0
          spawnDistanceMax: 140.0
          despawnDistance: 700.0
          lateralRange: 80.0
          verticalRange: 40.0
          baseYOffset: -10.0
          scaleMin: 0.6
          scaleMax: 2.5
          bobAmplitudeMin: 0.0
          bobAmplitudeMax: 3.0
          bobSpeedMin: 0.5
          bobSpeedMax: 1.5
