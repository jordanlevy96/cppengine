name: Release Build

on:
  push:
    tags:
      - 'v*'

env:
  GAME: vaporqube

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install freetype

      - name: Read app name
        id: app
        run: |
          APP_NAME=$(grep 'appName:' "res/games/${{ env.GAME }}/conf/settings.yaml" | head -1 | sed 's/.*appName:[[:space:]]*//')
          echo "name=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          ./scripts/export.sh --game ${{ env.GAME }} --skip-python

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app.outputs.name }}-macos
          path: dist/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libfreetype6-dev libgl-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev

      - name: Read app name
        id: app
        run: |
          APP_NAME=$(grep 'appName:' "res/games/${{ env.GAME }}/conf/settings.yaml" | head -1 | sed 's/.*appName:[[:space:]]*//')
          echo "name=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          ./scripts/export.sh --game ${{ env.GAME }} --skip-python

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app.outputs.name }}-linux
          path: dist/*.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          choco install freetype --yes

      - name: Read app name
        id: app
        shell: bash
        run: |
          APP_NAME=$(grep 'appName:' "res/games/${{ env.GAME }}/conf/settings.yaml" | head -1 | sed 's/.*appName:[[:space:]]*//')
          echo "name=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          ./scripts/export.sh --game ${{ env.GAME }} --skip-python

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app.outputs.name }}-windows
          path: dist/*.zip

  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read app name
        id: app
        run: |
          APP_NAME=$(grep 'appName:' "res/games/${{ env.GAME }}/conf/settings.yaml" | head -1 | sed 's/.*appName:[[:space:]]*//')
          echo "name=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.app.outputs.name }} ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/${{ steps.app.outputs.name }}-macos/*.dmg
            artifacts/${{ steps.app.outputs.name }}-linux/*.tar.gz
            artifacts/${{ steps.app.outputs.name }}-windows/*.zip
